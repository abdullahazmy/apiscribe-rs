[package]
name = "apiscribe"
version = "0.1.0"
edition = "2024"
description = "AI CLI built on Claude that documents backend APIs for frontend & mobile developers"
license = "MIT"
repository = "https://github.com/abdullahazmy/apiscribe-rs"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
headless_chrome = { version = "1.0.22", default-features = false }
html-escape = "0.2.15"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "http2", "system-proxy"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
terminal_size = "0.4.4"

[profile.release]
strip = true
lto = "thin"
